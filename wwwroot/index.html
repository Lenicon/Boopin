<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Boopin: spooky-cute plushies. Pastel ghosts, adorable bats and kawaii gothic creatures." />
    <meta name="theme-color" content="#1e1230" />
    <title>Boopin · Spooky-cute plushies</title>
    <base href="/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind via the Play CDN keeps the project build-step free.
         For production, see README.md ("Optional: compile Tailwind"). -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-theme.js"></script>
    <script>
        tailwind.config = { theme: { extend: boopinTheme } };
    </script>

    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;👻&lt;/text&gt;&lt;/svg&gt;" />
</head>

<body class="bg-plum-900 font-sans text-lavender-100 antialiased">
    <div id="app">
        <div class="loading-splash">
            <div class="loading-ghost" aria-hidden="true">👻</div>
            <p>Summoning plushies…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something spooked the app.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">✖</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
